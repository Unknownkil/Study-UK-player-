<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyUKplayer</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .video-container {
            position: relative;
            padding-top: 56.25%;
            max-width: 100%;
            height: auto;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .icon-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .icon {
            width: 40px;
            height: 40px;
            background-color: #448EE4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .icon:hover {
            background-color: #357bc4;
        }
        .icon img {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }
        .quality-options, .speed-options {
            display: none;
            position: absolute;
            top: 50px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 5px;
            overflow: hidden;
            z-index: 100;
        }
        .quality-options button, .speed-options button {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #fff;
            cursor: pointer;
        }
        .quality-options button:hover, .speed-options button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Welcome to StudyUK player</h2>
    <div class="video-container">
        <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto" data-setup='{"controls": true, "fluid": true, "aspectRatio":"16:9"}'>
            <source src="" type="application/x-mpegURL">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="icon-container">
        <div class="icon" id="shareBtn">
            <img src="https://img.icons8.com/ios-filled/50/ffffff/share.png" alt="Share">
        </div>
        <div class="icon" id="qualityBtn">
            <img src="https://img.icons8.com/ios-filled/50/ffffff/hd.png" alt="Quality">
        </div>
        <div class="icon" id="speedBtn">
            <img src="https://img.icons8.com/ios-filled/50/ffffff/fast-forward.png" alt="Speed">
        </div>
    </div>

    <!-- Quality options dropdown -->
    <div class="quality-options" id="qualityOptions">
        <button onclick="setQuality('low')">Low</button>
        <button onclick="setQuality('medium')">Medium</button>
        <button onclick="setQuality('high')">High</button>
    </div>

    <!-- Speed options dropdown -->
    <div class="speed-options" id="speedOptions">
        <button onclick="setSpeed(0.5)">0.5x</button>
        <button onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(1.5)">1.5x</button>
        <button onclick="setSpeed(2)">2x</button>
    </div>
</div>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-hls/5.15.0/videojs-contrib-hls.min.js"></script>

<script>
    let lastTap = 0;
    const player = videojs('videoPlayer');

    function getQueryParam(param) {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function base64Decode(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch (e) {
            console.error('Base64 decoding failed:', e);
            return null;
        }
    }

    function setupVideoPlayer() {
        const encodedUrl = getQueryParam('url');
        if (encodedUrl) {
            const hlsUrl = base64Decode(encodedUrl);
            if (hlsUrl) {
                player.src({ src: hlsUrl, type: 'application/x-mpegURL' });
                player.play();
            } else {
                alert("Invalid URL parameter!");
            }
        } else {
            alert("No URL parameter found!");
        }
    }
    setupVideoPlayer();

    document.getElementById('shareBtn').addEventListener('click', function() {
        const shareableUrl = window.location.href;
        prompt("Share this link:", shareableUrl);
    });

    document.getElementById('qualityBtn').addEventListener('click', function() {
        const qualityOptions = document.getElementById('qualityOptions');
        qualityOptions.style.display = qualityOptions.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('speedBtn').addEventListener('click', function() {
        const speedOptions = document.getElementById('speedOptions');
        speedOptions.style.display = speedOptions.style.display === 'none' ? 'block' : 'none';
    });

    function setQuality(quality) {
        const hlsUrl = base64Decode(getQueryParam('url'));
        if (hlsUrl) {
            player.src({ src: `${hlsUrl}&quality=${quality}`, type: 'application/x-mpegURL' });
            player.play();
        }
        document.getElementById('qualityOptions').style.display = 'none';
    }

    function setSpeed(speed) {
        player.playbackRate(speed);
        document.getElementById('speedOptions').style.display = 'none';
    }

    document.getElementById('videoPlayer_html5_api').addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 500 && tapLength > 0) {
            const seekTime = e.target.clientWidth / 2 > e.changedTouches[0].clientX ? -10 : 10;
            player.currentTime(player.currentTime() + seekTime);
        }
        lastTap = currentTime;
    });

    document.getElementById('videoPlayer_html5_api').addEventListener('touchstart', function(e) {
        const longPressDuration = 700;
        const longPressTimeout = setTimeout(() => player.playbackRate(2), longPressDuration);
        e.target.addEventListener('touchend', () => {
            clearTimeout(longPressTimeout);
            player.playbackRate(1);
        });
    });
</script>

</body>
</html>
